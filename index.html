<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="現場PRO">
<meta name="theme-color" content="#f0a500">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>現場ツール — 画像検索・編集・アルバム</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161b24;
    --surface2: #1e2636;
    --border: #2a3448;
    --accent: #f0a500;
    --accent2: #00c9a7;
    --red: #ff4757;
    --text: #e8eaf0;
    --muted: #6b7a99;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; overflow: hidden; }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── HEADER ── */
  #header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  #header h1 { font-size: 15px; font-weight: 900; letter-spacing: .08em; color: var(--accent); flex: 1; }
  #header h1 span { color: var(--accent2); }

  /* ── TABS ── */
  #tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 10px 4px;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    transition: .2s;
    letter-spacing: .04em;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-icon { display: block; font-size: 20px; margin-bottom: 2px; }

  /* ── PANELS ── */
  .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── SEARCH PANEL ── */
  #search-top {
    padding: 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-row { display: flex; gap: 8px; }
  #search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #search-input:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: .15s;
  }
  .btn:active { opacity: .8; transform: scale(.97); }
  .btn.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.teal { background: var(--accent2); color: #000; }

  /* camera / file input */
  .upload-row { display: flex; gap: 8px; }
  .upload-btn-wrap { flex: 1; position: relative; }
  .upload-btn-wrap input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-btn-wrap .btn { width: 100%; pointer-events: none; }

  #search-results {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    align-content: start;
  }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
    position: relative;
  }
  .result-card:active { border-color: var(--accent); transform: scale(.97); }
  .result-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .result-card .card-label { padding: 6px 8px; font-size: 11px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }
  .card-use-btn {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(0,0,0,.7);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ── EDIT PANEL ── */
  #edit-panel { position: relative; }
  #canvas-wrap {
    flex: 1;
    overflow: hidden;
    background: #111;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #main-canvas {
    max-width: 100%;
    max-height: 100%;
    cursor: crosshair;
    touch-action: none;
    display: block;
  }
  #crop-overlay {
    position: absolute;
    border: 2px dashed var(--accent);
    pointer-events: none;
    display: none;
  }

  /* toolbar */
  #toolbar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .tool-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tool-label { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .08em; min-width: 44px; }

  .tool-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 10px;
    cursor: pointer;
    transition: .15s;
    white-space: nowrap;
  }
  .tool-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,.12); }
  .tool-btn:active { transform: scale(.95); }

  #pen-size {
    -webkit-appearance: none;
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  #pen-size::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .color-swatch {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    flex-shrink: 0;
    transition: .15s;
  }
  .color-swatch.active { border-color: #fff; transform: scale(1.2); }

  #edit-no-image {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 12px;
    font-size: 14px;
  }
  #edit-no-image .big-icon { font-size: 48px; }

  /* ── ALBUM PANEL ── */
  #album-panel { }
  #album-top {
    padding: 10px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #album-name-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #album-name-input:focus { border-color: var(--accent2); }

  #album-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .album-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .album-header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .album-header .album-name { font-weight: 700; font-size: 13px; flex: 1; }
  .album-header .album-count { font-size: 11px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }
  .album-header .album-del { font-size: 18px; cursor: pointer; color: var(--red); padding: 0 4px; }
  .album-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .album-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: .2s;
  }
  .album-thumb:active { border-color: var(--accent); }
  .album-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .album-thumb .thumb-del {
    position: absolute;
    top: 3px; right: 3px;
    background: rgba(0,0,0,.7);
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--red);
    border: 1px solid var(--red);
  }

  /* ── MODAL ── */
  #modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  #modal-bg.open { display: flex; }
  #modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 90%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #modal h3 { font-size: 15px; font-weight: 900; color: var(--accent); }
  #modal select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    width: 100%;
  }
  #modal .modal-row { display: flex; gap: 8px; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent2);
    color: #000;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }


  /* ── SEARCH MODE ── */
  .search-mode-row { display:flex; gap:6px; margin-bottom:8px; }
  .mode-btn {
    flex:1; padding:8px 4px; font-size:11px; font-weight:700;
    background:var(--surface2); border:2px solid var(--border);
    border-radius:8px; color:var(--muted); cursor:pointer; transition:.15s;
    font-family:inherit;
  }
  .mode-btn.active { border-color:var(--accent); color:var(--accent); background:rgba(240,165,0,.1); }

  /* ── AI RESULT CARD ── */
  #ai-result-card { margin:8px 12px 0; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:12px; font-size:13px; line-height:1.7; flex-shrink:0; }
  .ai-tag { display:inline-block; background:var(--accent); color:#000; font-size:10px; font-weight:900; padding:2px 7px; border-radius:4px; margin-right:6px; font-family:'Share Tech Mono',monospace; }
  .ai-tag.maker { background:var(--accent2); }
  .ai-tag.model { background:#54a0ff; color:#fff; }
  .ai-maker-link { color:var(--accent2); font-size:12px; word-break:break-all; text-decoration:underline; cursor:pointer; }
  .ai-img-suggest { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .ai-img-chip {
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    padding:5px 10px; font-size:11px; color:var(--text); cursor:pointer; transition:.15s;
  }
  .ai-img-chip:active { border-color:var(--accent); color:var(--accent); }
  .thinking-anim { color:var(--accent); font-size:13px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .thinking-anim span { animation:blink 1.2s infinite; }
  .thinking-anim span:nth-child(2){animation-delay:.2s}
  .thinking-anim span:nth-child(3){animation-delay:.4s}

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* compress indicator */
  .compress-badge {
    background: var(--accent2);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <h1>🔧 現場ツール <span>PRO</span></h1>
    <span class="compress-badge">印刷対応圧縮</span>
  </div>

  <!-- TABS -->
  <div id="tabs">
    <div class="tab active" onclick="switchTab('search')">
      <span class="tab-icon">🔍</span>検索
    </div>
    <div class="tab" onclick="switchTab('edit')">
      <span class="tab-icon">✏️</span>編集
    </div>
    <div class="tab" onclick="switchTab('album')">
      <span class="tab-icon">📁</span>アルバム
    </div>
  </div>

  <!-- ══ SEARCH PANEL ══ -->
  <div id="panel-search" class="panel active">
    <div id="search-top">
      <!-- モード切替: 2モード -->
      <div class="search-mode-row">
        <button class="mode-btn active" id="mode-text" onclick="setSearchMode('text')">⌨️ 品番・商品名</button>
        <button class="mode-btn" id="mode-photo" onclick="setSearchMode('photo')">📷 写メAI解析</button>
      </div>
      <!-- テキスト入力 -->
      <div id="search-mode-text">
        <div class="search-row">
          <input id="search-input" type="text" placeholder="品番・商品名・メーカー名…" />
          <button class="btn" onclick="doAiTextSearch()">🤖 AI検索</button>
        </div>
      </div>
      <!-- 写メAI解析 -->
      <div id="search-mode-photo" style="display:none">
        <div class="upload-row">
          <div class="upload-btn-wrap">
            <button class="btn" style="background:var(--accent2);color:#000;font-weight:900">📷 カメラ撮影</button>
            <input type="file" accept="image/*" capture="environment" onchange="doAiImageAnalyze(event)" />
          </div>
          <div class="upload-btn-wrap">
            <button class="btn secondary">🖼 アルバムから選択</button>
            <input type="file" accept="image/*" onchange="doAiImageAnalyze(event)" />
          </div>
        </div>
        <div id="ai-analyze-preview" style="display:none;margin-top:6px">
          <img id="ai-preview-img" style="width:100%;max-height:110px;object-fit:contain;border-radius:8px;border:1px solid var(--border)" />
        </div>
      </div>
    </div>
    <!-- スクロール領域 -->
    <div id="search-scroll" style="flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px">
      <div id="search-placeholder" style="color:var(--muted);font-size:13px;text-align:center;padding:30px;line-height:2">
        🤖 AIが商品情報を解析します<br>
        <span style="font-size:11px">品番入力 または 写メ撮影で開始</span>
      </div>
      <div id="ai-result-card" style="display:none">
        <div id="ai-result-inner"></div>
      </div>
    </div>
  </div>

  <!-- ══ EDIT PANEL ══ -->
  <div id="panel-edit" class="panel">
    <div id="canvas-wrap">
      <canvas id="main-canvas"></canvas>
      <div id="crop-overlay"></div>
      <div id="edit-no-image">
        <span class="big-icon">🖼</span>
        <span>検索から画像を選択<br>またはカメラ/ファイルを読み込む</span>
        <div class="upload-btn-wrap" style="width:160px">
          <button class="btn teal">📷 画像を開く</button>
          <input type="file" accept="image/*" onchange="loadImageFile(event)" />
        </div>
      </div>
    </div>
    <div id="toolbar">
      <!-- ROW 1: モード -->
      <div class="tool-row">
        <span class="tool-label">モード</span>
        <button class="tool-btn active" id="btn-pen" onclick="setMode('pen')">✏️ ペン</button>
        <button class="tool-btn" id="btn-hl" onclick="setMode('highlight')">🖊 蛍光</button>
        <button class="tool-btn" id="btn-crop" onclick="setMode('crop')">✂️ トリム</button>
        <button class="tool-btn" id="btn-erase" onclick="setMode('erase')">🧹 消しゴム</button>
      </div>
      <!-- ROW 2: 色 -->
      <div class="tool-row">
        <span class="tool-label">色</span>
        <div class="color-swatch active" style="background:#f0a500" onclick="setColor('#f0a500',this)"></div>
        <div class="color-swatch" style="background:#ff4757" onclick="setColor('#ff4757',this)"></div>
        <div class="color-swatch" style="background:#00c9a7" onclick="setColor('#00c9a7',this)"></div>
        <div class="color-swatch" style="background:#54a0ff" onclick="setColor('#54a0ff',this)"></div>
        <div class="color-swatch" style="background:#ff6b81" onclick="setColor('#ff6b81',this)"></div>
        <div class="color-swatch" style="background:#ffffff" onclick="setColor('#ffffff',this)"></div>
        <div class="color-swatch" style="background:#000000;border:1px solid #444" onclick="setColor('#000000',this)"></div>
      </div>
      <!-- ROW 3: 線幅 -->
      <div class="tool-row">
        <span class="tool-label">線幅</span>
        <input type="range" id="pen-size" min="1" max="40" value="4" oninput="updatePenSize(this.value)" />
        <span id="pen-size-label" style="font-size:12px;font-family:monospace;color:var(--accent);min-width:28px">4px</span>
      </div>
      <!-- ROW 4a: 操作 -->
      <div class="tool-row">
        <button class="btn secondary" style="flex:1" onclick="undoDraw()">↩ 戻す</button>
        <button class="btn secondary" style="flex:1" onclick="clearDraw()">🗑 全消去</button>
        <button class="btn" style="flex:1" onclick="applyCrop()">✂️ 切取適用</button>
      </div>
      <!-- ROW 4b: 保存（独立行・目立つ大ボタン） -->
      <div class="tool-row">
        <button class="btn teal" style="flex:1;font-size:15px;padding:12px;letter-spacing:.06em;font-weight:900" onclick="openSaveModal()">💾 アルバムに保存</button>
      </div>
    </div>
  </div>

  <!-- ══ ALBUM PANEL ══ -->
  <div id="panel-album" class="panel">
    <div id="album-top">
      <input id="album-name-input" type="text" placeholder="新しいアルバム名を入力…" />
      <button class="btn teal" style="width:100%;padding:12px;font-size:15px;font-weight:900;letter-spacing:.06em" onclick="createAlbum()">＋ アルバムを作成</button>
    </div>
    <div id="album-list">
      <div id="album-empty" style="text-align:center;padding:30px;color:var(--muted);font-size:13px">
        アルバムがありません<br>上のフォームから作成してください
      </div>
    </div>
  </div>

</div><!-- #app -->

<!-- MODAL: save to album -->
<div id="modal-bg">
  <div id="modal">
    <h3>💾 アルバムに保存</h3>
    <select id="modal-album-select"></select>
    <div class="modal-row">
      <button class="btn secondary" style="flex:1" onclick="closeModal()">キャンセル</button>
      <button class="btn teal" style="flex:1" onclick="saveToAlbum()">保存</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let currentTab = 'search';
let editMode = 'pen';   // pen | highlight | crop | erase
let penColor = '#f0a500';
let penSize = 4;
let isDrawing = false;
let cropStart = null;
let cropRect = null;
let drawHistory = [];  // {imageData}
let albums = loadAlbums();
let currentImageDataURL = null;

// ═══════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['search','edit','album'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'album') renderAlbums();
}

// ═══════════════════════════════════════════
// SEARCH MODE SWITCH
// ═══════════════════════════════════════════
function setSearchMode(mode) {
  ['text','photo'].forEach(m => {
    document.getElementById('mode-'+m).classList.toggle('active', m===mode);
    document.getElementById('search-mode-'+m).style.display = m===mode ? 'block' : 'none';
  });
}

// ═══════════════════════════════════════════
// AI TEXT SEARCH（品番・商品名）
// ═══════════════════════════════════════════
async function doAiTextSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) { toast('品番または商品名を入力してください'); return; }
  showAiThinking();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',

// ═══════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const noImg = document.getElementById('edit-no-image');

function setupCanvas(img) {
  // 印刷対応圧縮: max 1200px
  const MAX = 1200;
  let w = img.naturalWidth, h = img.naturalHeight;
  if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
  if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(img, 0, 0, w, h);
  noImg.style.display = 'none';
  drawHistory = [];
  saveHistory();
  fitCanvas();
}

function fitCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const wr = wrap.getBoundingClientRect();
  const scale = Math.min(wr.width / canvas.width, wr.height / canvas.height, 1);
  canvas.style.width = (canvas.width * scale) + 'px';
  canvas.style.height = (canvas.height * scale) + 'px';
}

window.addEventListener('resize', fitCanvas);

// ═══════════════════════════════════════════
// DRAWING
// ═══════════════════════════════════════════
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - r.left) * scaleX, y: (clientY - r.top) * scaleY };
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startDraw(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); endDraw(e); }, { passive: false });

function startDraw(e) {
  if (!canvas.width) return;
  isDrawing = true;
  const p = canvasPoint(e);
  if (editMode === 'crop') {
    cropStart = p;
    cropRect = null;
    const overlay = document.getElementById('crop-overlay');
    overlay.style.display = 'block';
    return;
  }
  saveHistory();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  if (editMode === 'highlight') {
    ctx.globalAlpha = 0.4;
    ctx.globalCompositeOperation = 'source-over';
  } else if (editMode === 'erase') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.strokeStyle = penColor;
  ctx.lineWidth = editMode === 'highlight' ? penSize * 3 : penSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

function draw(e) {
  if (!isDrawing || !canvas.width) return;
  const p = canvasPoint(e);
  if (editMode === 'crop') {
    updateCropOverlay(cropStart, p);
    cropRect = { x: Math.min(cropStart.x, p.x), y: Math.min(cropStart.y, p.y),
                 w: Math.abs(p.x - cropStart.x), h: Math.abs(p.y - cropStart.y) };
    return;
  }
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
}

function endDraw(e) {
  if (!isDrawing) return;
  isDrawing = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function updateCropOverlay(a, b) {
  const r = canvas.getBoundingClientRect();
  const scaleX = r.width / canvas.width;
  const scaleY = r.height / canvas.height;
  const wrap = document.getElementById('canvas-wrap');
  const wrapR = wrap.getBoundingClientRect();
  const canvasOffX = r.left - wrapR.left;
  const canvasOffY = r.top - wrapR.top;
  const x1 = Math.min(a.x, b.x) * scaleX + canvasOffX;
  const y1 = Math.min(a.y, b.y) * scaleY + canvasOffY;
  const w2 = Math.abs(a.x - b.x) * scaleX;
  const h2 = Math.abs(a.y - b.y) * scaleY;
  const ov = document.getElementById('crop-overlay');
  ov.style.left = x1 + 'px';
  ov.style.top = y1 + 'px';
  ov.style.width = w2 + 'px';
  ov.style.height = h2 + 'px';
}

// ─── CROP APPLY ───
function applyCrop() {
  if (!cropRect || cropRect.w < 5 || cropRect.h < 5) {
    toast('トリミング範囲を指定してください');
    return;
  }
  const { x, y, w, h } = cropRect;
  const imgData = ctx.getImageData(x, y, w, h);
  canvas.width = w;
  canvas.height = h;
  ctx.putImageData(imgData, 0, 0);
  document.getElementById('crop-overlay').style.display = 'none';
  cropRect = null;
  cropStart = null;
  fitCanvas();
  toast('✂️ トリミング完了');
  saveHistory();
}

// ─── HISTORY ───
function saveHistory() {
  if (!canvas.width) return;
  drawHistory.push(canvas.toDataURL());
  if (drawHistory.length > 20) drawHistory.shift();
}

function undoDraw() {
  if (drawHistory.length <= 1) { toast('これ以上戻れません'); return; }
  drawHistory.pop();
  const prev = drawHistory[drawHistory.length - 1];
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = prev;
}

function clearDraw() {
  if (!canvas.width) return;
  if (!confirm('描画を全消去しますか？')) return;
  saveHistory();
  // restore original (first history)
  const orig = drawHistory[0];
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = orig;
  toast('🗑 消去しました');
}

// ─── MODE / COLOR / SIZE ───
function setMode(m) {
  editMode = m;
  ['pen','hl','crop','erase'].forEach(id => {
    document.getElementById('btn-' + id).classList.toggle('active', id === (m==='highlight'?'hl':m));
  });
  document.getElementById('crop-overlay').style.display = 'none';
}

function setColor(c, el) {
  penColor = c;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

function updatePenSize(v) {
  penSize = parseInt(v);
  document.getElementById('pen-size-label').textContent = v + 'px';
}

// ═══════════════════════════════════════════
// COMPRESS & SAVE
// ═══════════════════════════════════════════
function getCompressedDataURL() {
  // 印刷対応: 最大720px, JPEG 0.82
  const MAX = 720;
  const tmp = document.createElement('canvas');
  let w = canvas.width, h = canvas.height;
  if (w > MAX || h > MAX) {
    if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
    else { w = Math.round(w * MAX / h); h = MAX; }
  }
  tmp.width = w; tmp.height = h;
  tmp.getContext('2d').drawImage(canvas, 0, 0, w, h);
  return tmp.toDataURL('image/jpeg', 0.82);
}

    const div = document.createElement('div');
    div.className = 'album-group';
    div.innerHTML = `
      <div class="album-header">
        <span style="font-size:18px">📁</span>
        <span class="album-name">${album.name}</span>
        <span class="album-count">${album.images.length}枚</span>
        <span class="album-del" onclick="deleteAlbum(${ai})">🗑</span>
      </div>
      <div class="album-grid" id="grid-${ai}"></div>`;
    list.appendChild(div);

    const grid = div.querySelector('.album-grid');
    if (album.images.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);font-size:12px;padding:10px;text-align:center">画像なし</div>';
    } else {
      album.images.forEach((img, ii) => {
        const t = document.createElement('div');
        t.className = 'album-thumb';
        t.innerHTML = `<img src="${img.dataURL}" loading="lazy" onclick="openImageToEdit(${ai},${ii})" />
                       <div class="thumb-del" onclick="deleteImage(${ai},${ii})">✕</div>`;
        grid.appendChild(t);
      });
    }
  });
}

// ═══════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderAlbums();
</script>

<script>
// ── PWA Service Worker 登録 ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.warn('SW error:', err));
  });
}

// ── iOS Safari「ホーム画面に追加」バナー ──
(function() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const dismissed = localStorage.getItem('pwa-banner-dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.id = 'pwa-banner';
      banner.innerHTML = `
        <div style="position:fixed;bottom:0;left:0;right:0;background:#1e2636;border-top:2px solid #f0a500;padding:12px 16px;z-index:9999;display:flex;align-items:center;gap:10px;font-family:'Noto Sans JP',sans-serif">
          <img src="./icon-192.png" style="width:40px;height:40px;border-radius:10px;flex-shrink:0">
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;color:#f0a500">📲 ホーム画面に追加</div>
            <div style="font-size:11px;color:#6b7a99;margin-top:2px">Safari下部の <strong style="color:#e8eaf0">共有ボタン</strong> →「ホーム画面に追加」でアプリとして使えます</div>
          </div>
          <button onclick="document.getElementById('pwa-banner').remove();localStorage.setItem('pwa-banner-dismissed','1')"
            style="background:none;border:none;color:#6b7a99;font-size:20px;cursor:pointer;padding:4px">✕</button>
        </div>`;
      document.body.appendChild(banner);
    }, 2000);
  }
})();
</script>
